name: SDK smoke

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/sdk-smoke/javascript/package-lock.json

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: examples/sdk-smoke/python/requirements.txt

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: examples/sdk-smoke/go/go.sum

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache@v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('examples/sdk-smoke/dotnet/Smoke.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build the CLI
        run: npm ci && npm run build

      - id: emulator-image
        name: Resolve emulator image tag
        run: echo "tag=$(node scripts/resolve-emulator-image-tag.js)" >> "$GITHUB_OUTPUT"

      - id: emulator-cache-period
        name: Set weekly image cache period
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4.3.0
        id: emulator-image-cache
        with:
          path: ${{ runner.temp }}/aws-emulator-image.tar
          key: emulator-image-${{ runner.os }}-${{ runner.arch }}-${{ steps.emulator-image.outputs.tag }}-${{ steps.emulator-cache-period.outputs.week }}

      - name: Load cached emulator image
        if: steps.emulator-image-cache.outputs.cache-hit == 'true'
        env:
          IMAGE_TAG: ${{ steps.emulator-image.outputs.tag }}
        run: |
          if ! docker load --input "$RUNNER_TEMP/aws-emulator-image.tar"; then
            echo "Cached image could not be loaded; SDK smoke will rebuild it."
            docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true
          fi

      - name: Install SDK smoke dependencies
        run: |
          python -m pip install -r examples/sdk-smoke/python/requirements.txt
          npm ci --prefix examples/sdk-smoke/javascript
          mvn -B -f examples/sdk-smoke/java/pom.xml package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          (cd examples/sdk-smoke/go && go mod download && go build ./...)
          cargo build --locked --manifest-path examples/sdk-smoke/rust/Cargo.toml
          dotnet restore examples/sdk-smoke/dotnet/Smoke.csproj
          dotnet build --no-restore examples/sdk-smoke/dotnet/Smoke.csproj
          aws --version

      - name: Run SDK smoke checks
        env:
          AWS_ACCESS_KEY_ID: host-credentials-must-not-leak
          AWS_SECRET_ACCESS_KEY: host-credentials-must-not-leak
          AWS_SESSION_TOKEN: host-credentials-must-not-leak
          AWS_PROFILE: host-profile-must-not-leak
          AWS_ENDPOINT_URL_STS: https://must-not-override-the-emulator.invalid
          AWS_ENDPOINT_URL_PREFIX: https://must-not-prefix-the-emulator.invalid
        run: node bin/awesome-emulator.js run --telemetry off --sdk java-v2 --sdk rust --sdk dotnet -- bash examples/sdk-smoke/run.sh

      - name: Save emulator image for future runs
        if: success() && steps.emulator-image-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.emulator-image.outputs.tag }}
        run: docker save --output "$RUNNER_TEMP/aws-emulator-image.tar" "$IMAGE_TAG"
