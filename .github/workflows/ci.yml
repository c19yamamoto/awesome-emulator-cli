name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - id: emulator-image
        name: Resolve emulator image tag
        run: echo "tag=$(node scripts/resolve-emulator-image-tag.js)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4.3.0
        id: emulator-image-cache
        with:
          path: ${{ runner.temp }}/aws-emulator-image.tar
          key: emulator-image-${{ runner.os }}-${{ runner.arch }}-${{ steps.emulator-image.outputs.tag }}
      - name: Load cached emulator image
        if: steps.emulator-image-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/aws-emulator-image.tar"
      - run: npm run test:integration
        env:
          AWS_EMULATOR_INTEGRATION_TESTS: "1"
      - name: Save emulator image for future runs
        if: success() && steps.emulator-image-cache.outputs.cache-hit != 'true'
        env:
          IMAGE_TAG: ${{ steps.emulator-image.outputs.tag }}
        run: docker save --output "$RUNNER_TEMP/aws-emulator-image.tar" "$IMAGE_TAG"
