name: Publish fork coverage comment

on:
  workflow_run:
    workflows: [Test coverage]
    types: [completed]

permissions:
  contents: read

jobs:
  coverage-comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build:coverage-tools

      - name: Download the report artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPOSITORY: ${{ github.repository }}
        run: gh run download "$RUN_ID" --repo "$GH_REPOSITORY" --name coverage-report --dir coverage-report

      - name: Create or update the fork PR coverage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          COVERAGE_RESULT: ${{ github.event.workflow_run.conclusion }}
          COVERAGE_REPORT_PATH: coverage-report/report.md
        run: node .coverage-tools/scripts/coverage/publish-coverage-comment.js
