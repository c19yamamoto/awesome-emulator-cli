[package]
name = "aws-emulator-sdk-smoke"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "=1.13.3"
# Use the current HTTPS client and keep aws-sdk-sts's legacy Rustls connector disabled.
aws-sdk-sts = { version = "=1.128.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
